[settings]
experimental = true

[tools]
gh = "latest"
ghq = "latest"

[tasks.homebrewupgrade]
description = "Upgrade Homebrew packages"
run = [
    "brew upgrade --greedy --yes",
    "brew autoremove",
    "brew cleanup",
]
dir = "{{cwd}}"
interactive = true

[tasks.miseupgrade]
description = "Upgrade mise packages"
run = [
    "mise self-update --yes",
    "mise upgrade",
]
dir = "{{cwd}}"

[tasks.rustupupdate]
description = "Upgrade rustup components"
run = [
    "rustup update",
]
dir = "{{cwd}}"

[tasks.skillsupdate]
description = "Upgrade global skills"
run = [
    "npx skills update --global --yes",
]
dir = "{{cwd}}"

[tasks.up]
description = "Upgrade dependencies in my local environment"
depends = [
    "homebrewupgrade",
    "miseupgrade",
    "rustupupdate",
    "skillsupdate",
]
